# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!uv.lock"
    - "!docs/source/_build/**"
    - "!tests/test_files/**"
  path_instructions:
    - path: "pymatgen/analysis/defects/**/*.py"
      instructions: >-
        Public functions and classes need numpy-style docstrings and type hints.
        Flag physics or unit mistakes (eV, Angstrom, charge sign conventions).
    - path: "tests/**"
      instructions: >-
        Tests use pytest with fixtures from tests/conftest.py. Prefer fixtures
        over repeated file loading; flag tests without assertions.
