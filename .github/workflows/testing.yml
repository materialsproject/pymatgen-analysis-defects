name: testing
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

# A new push to a PR cancels its older runs; runs on main always finish (they deploy docs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      # Hooks run in their own environments; cache those instead of installing the package
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      PMG_MAPI_KEY: ${{ secrets.PMG_MAPI_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true

      - name: Install dependencies
        run: uv pip install -e .[tests,optional]

      - name: Test Modules
        run: pytest -n logical --cov=pymatgen --cov-report=xml

      - name: Test Notebooks
        run: pytest -n logical --nbmake ./docs/source/content

      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # versioningit derives the version from git tags
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - name: Import the installed wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import pymatgen.analysis.defects.thermo"

  docs:
    runs-on: ubuntu-latest

    env:
      PMG_MAPI_KEY: ${{ secrets.PMG_MAPI_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          activate-environment: true
          enable-cache: true

      - name: Install dependencies
        run: uv pip install -e .[docs,finder]
      - name: Build
        working-directory: docs/source
        env:
          BASE_URL: /pymatgen-analysis-defects
        run: |
          jupyter-book build --html --execute --strict
          pdoc pymatgen.analysis.defects -d google -o _build/html/api
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./docs/source/_build/html
