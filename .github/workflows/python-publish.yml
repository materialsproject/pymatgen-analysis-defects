# Release: tag vYYYY.M.D, create the GitHub release, publish to PyPI.
# Runs on the button (tests first, always releases) or after testing passes on a push to main
# (releases that exact commit, only if a feat/fix/perf commit touched the package since the last tag).
# Keep this filename: it is the workflow registered as the PyPI trusted publisher.
name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [testing]
    types: [completed]
    branches: [main]

# Not `${{ github.workflow }}-...`: testing.yml uses that group and inherits this workflow's name.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      release: ${{ steps.check.outputs.release }}
    steps:
      # The verified commit, even if main has moved on since.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Check release-worthiness
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          range="$sha"
          if last="$(git describe --tags --abbrev=0 --match 'v*' "$sha" 2>/dev/null)"; then
            range="$last..$sha"
          fi
          echo "Package commits in $range:"
          subjects="$(git log --format=%s "$range" -- pymatgen pyproject.toml)"
          echo "$subjects"
          if echo "$subjects" | grep -Eq '^(feat|fix|perf)(\([^)]*\))?!?:'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No feat/fix/perf package changes; skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # workflow_run already has passing tests for this commit.
  tests:
    needs: gate
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/testing.yml
    secrets: inherit

  build:
    needs: [gate, tests]
    if: >-
      !cancelled() && needs.gate.outputs.release == 'true' &&
      (needs.tests.result == 'success' ||
       (github.event_name == 'workflow_run' && needs.tests.result == 'skipped'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0  # versioningit derives the version from git tags
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Compute release tag
        id: tag
        run: |
          base="v$(date -u +%Y.%-m.%-d)"
          tag="$base"
          n=0
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            n=$((n + 1))
            tag="$base.post$n"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      # Local only, so versioningit sees it; `gh release create` pushes the real tag.
      - name: Tag locally and check the version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git tag "$TAG"
          version="$(uvx --from 'versioningit>=1,<4' versioningit .)"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::versioningit gives '$version', expected '${TAG#v}'"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # !cancelled(): plain success() would see the skipped tests job upstream and skip these.
  release:
    needs: [gate, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes

  publish:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
