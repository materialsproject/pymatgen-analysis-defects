# One-click release: test, tag vYYYY.M.D, create the GitHub release, publish to PyPI.
# Keep this filename: it is the workflow registered as the PyPI trusted publisher.
name: Release

on:
  workflow_dispatch:

# Not `${{ github.workflow }}-...`: testing.yml uses that group and inherits this workflow's name.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/testing.yml
    secrets: inherit

  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # versioningit derives the version from git tags
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Compute release tag
        id: tag
        run: |
          base="v$(date -u +%Y.%-m.%-d)"
          tag="$base"
          n=0
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            n=$((n + 1))
            tag="$base.post$n"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      # Local only, so versioningit sees it; `gh release create` pushes the real tag.
      - name: Tag locally and check the version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git tag "$TAG"
          version="$(uvx --from 'versioningit>=1,<4' versioningit .)"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::versioningit gives '$version', expected '${TAG#v}'"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
