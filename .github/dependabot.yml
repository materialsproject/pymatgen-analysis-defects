version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  allow:
  - dependency-type: direct
  - dependency-type: indirect
  ignore:
    - dependency-name: mistune
    - dependency-name: numpy
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
